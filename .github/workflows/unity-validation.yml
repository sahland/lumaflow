name: Unity validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-matrix:
    name: Reviewed Unity matrix
    runs-on: ubuntu-latest
    outputs:
      unity: ${{ steps.plan.outputs.unity }}
      testMode: ${{ steps.plan.outputs.testMode }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        run: python Tools/LumaFlow/Validation/unity_matrix.py --github-output "$GITHUB_OUTPUT"

  unity-license-preflight:
    name: Unity activation configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require Unity activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -n "$UNITY_LICENSE" || ( -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ) ]]; then
            echo "Unity activation inputs are configured; validity is checked by Unity."
          else
            echo "::error::Unity activation is not configured. Add UNITY_EMAIL and UNITY_PASSWORD (plus UNITY_SERIAL for Pro), or a supported UNITY_LICENSE, in repository Settings > Secrets and variables > Actions. See Tools/LumaFlow/Validation/RELEASE.md."
            exit 1
          fi

  release-payloads:
    name: Git-UPM and Asset Store payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging rules
        run: python -m unittest discover -s Tools/LumaFlow/Validation -p 'test_*.py'
      - name: Protect frozen Runtime API contracts
        run: python Tools/LumaFlow/Validation/check_api_contract.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Build and inspect both payloads
        run: python Tools/LumaFlow/Validation/package_release.py --output Artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-payloads
          path: Artifacts/release
          if-no-files-found: error

  icon-validation:
    name: Icon catalog and CC0 provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate icons and catalog
        run: |
          python Tools/LumaFlow/Icons/validate_icons.py
          python Tools/LumaFlow/Icons/generate_luma_icons.py --check-catalog Packages/com.sahland.lumaflow/Runtime/Controls/Button.cs
          python -m unittest discover -s Tools/LumaFlow/Icons -p "test_*.py"

  clean-package-tests:
    name: Built-In ${{ matrix.unity }} ${{ matrix.channel }}
    needs: [unity-matrix, release-payloads, unity-license-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        unity: ${{ fromJSON(needs.unity-matrix.outputs.unity) }}
        channel: ${{ fromJSON(needs.unity-matrix.outputs.channel) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-payloads
          path: Artifacts/release
      - name: Prepare clean tarball consumer
        env:
          CHANNEL: ${{ matrix.channel }}
          UNITY_VERSION: ${{ matrix.unity }}
        run: |
          python Tools/LumaFlow/Validation/prepare_tarball_project.py \
            --archive "Artifacts/release/com.sahland.lumaflow-$(python -c 'import json; print(json.load(open("Artifacts/release/release-report.json"))["version"])')-${CHANNEL}.tgz" \
            --output Artifacts/consumer --unity "$UNITY_VERSION" --channel "$CHANNEL"
      - name: Run clean EditMode and PlayMode smoke tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Artifacts/consumer
          unityVersion: ${{ matrix.unity }}
          testMode: all
          artifactsPath: artifacts/clean-${{ matrix.unity }}-${{ matrix.channel }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Built-In ${{ matrix.unity }} ${{ matrix.channel }}
      - name: Require actual passing test evidence
        if: always()
        run: python Tools/LumaFlow/Validation/check_smoke_results.py artifacts/clean-${{ matrix.unity }}-${{ matrix.channel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-${{ matrix.unity }}-${{ matrix.channel }}
          if-no-files-found: error
          path: |
            artifacts/clean-${{ matrix.unity }}-${{ matrix.channel }}
            Artifacts/consumer/Artifacts/PlayerSmoke

  package-tests:
    needs: [unity-matrix, unity-license-preflight]
    name: Functional ${{ matrix.unity }} ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        unity: ${{ fromJSON(needs.unity-matrix.outputs.unity) }}
        testMode: ${{ fromJSON(needs.unity-matrix.outputs.testMode) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated functional suites
        run: python Tools/LumaFlow/Validation/prepare_suite_project.py --output Artifacts/suite --unity "${{ matrix.unity }}"

      - name: Run Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Artifacts/suite
          unityVersion: ${{ matrix.unity }}
          testMode: ${{ matrix.testMode }}
          customParameters: -assemblyNames ${{ matrix.testMode == 'editmode' && 'LumaFlow.Editor.Tests' || 'LumaFlow.Runtime.Tests' }}
          artifactsPath: artifacts/suite-${{ matrix.unity }}-${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Functional ${{ matrix.unity }} ${{ matrix.testMode }}

      - name: Require actual functional test evidence
        if: always()
        run: python Tools/LumaFlow/Validation/check_suite_results.py artifacts/suite-${{ matrix.unity }}-${{ matrix.testMode }} --mode "${{ matrix.testMode }}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.unity }}-${{ matrix.testMode }}-results
          path: artifacts/suite-${{ matrix.unity }}-${{ matrix.testMode }}
          if-no-files-found: error

  unity-validation-gate:
    name: Unity validation gate
    if: always()
    needs: [unity-matrix, unity-license-preflight, release-payloads, icon-validation, clean-package-tests, package-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix and prerequisite job to succeed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["NEEDS_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if not results or failed:
              raise SystemExit("Required CI jobs not successful: " + ", ".join(failed))
          print("Every required Unity matrix job succeeded.")
          PY
